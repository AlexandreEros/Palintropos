[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palintropos"
version = "0.1.0"
description = "Core spectral / spherical-harmonics engine for Palintropos"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Alexandre Silva" }
]

# Runtime dependencies live in requirements.txt so the pinned versions have a single source of truth.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
# Reading NetCDF elevation files (tropoi.spatial.terrain.raster). Bitmaps and
# TIFF use Pillow (pinned in requirements.txt).
terrain = ["netCDF4"]
dev = [
  "pytest",
  "ipykernel",
  # tools/architecture only (pinned: they determine the generated graphs)
  "grimp==3.17",
  "networkx==3.7",
]

# The single public command-line interface.
[project.scripts]
tropoi = "tropoi.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tropoi*"]

# Make sure the CUDA kernel sources are included. They live beside the
# transforms that compile them (tropoi/spatial/transforms/cuda/) and are
# located at run time through importlib.resources, so an installed
# distribution needs no source checkout.
[tool.setuptools.package-data]
"tropoi.spatial.transforms.cuda" = ["*.cu"]
# The self-contained terrain-globe page template (read via importlib.resources).
"tropoi.representation.visual" = ["*.html"]

[tool.deptry]
# Treat the "dev" PEP 621 optional-dependency group as development-only.
optional_dependencies_dev_groups = ["dev"]

# tools/ is repository tooling, not part of the installed package; its
# imports of dev-only dependencies (grimp, networkx) are intentional.
extend_exclude = ["tools"]

[tool.deptry.package_module_name_map]
cupy-cuda11x = ["cupy", "cupyx", "cupy_backends"]

[tool.pytest.ini_options]
markers = [
    "slow: long numerical convergence validation (select with -m slow; exclude with -m 'not slow')",
]
# Restrict discovery to tests/ so a pathless `pytest` from the project root
# does not walk sibling output directories. A stale psx-bve-* fallback run dir
# (and a similarly locked .pytest_cache) proved unreadable during collection
# and aborted a bare run with PermissionError -- those dirs carry an ACL for a
# different security identity, not the account running pytest. Since
# norecursedirs *replaces* pytest's default list, the defaults are kept here
# and "runs"/"psx-bve-*" appended.
testpaths = ["tests"]
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "runs",
    "psx-bve-*",
]
