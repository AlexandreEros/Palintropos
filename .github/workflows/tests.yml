# Runs the CPU part of the test suite on every push.
#
# GitHub-hosted runners have no GPU, so CuPy is not installed: tests that need
# CUDA skip themselves (pytest.importorskip / cupy.is_available() guards) and
# everything that runs on the host is exercised. GPU regression and long
# numerical validation run locally with the selections documented under
# "Tests" in docs/ARCHITECTURE.md. CI does not exclude the slow marker.
name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      # Full history: tests/test_held_suarez_notebook.py checks that the
      # notebook's pinned SOLVER_COMMIT exists and is an ancestor of HEAD
      # (the default shallow clone has neither).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The runtime pins minus CuPy, plus the architecture-tool pins so its
      # tests run too. The package is installed without dependencies so pip
      # does not pull CuPy back in through requirements.txt. netCDF4 is the
      # optional "terrain" extra, installed so the NetCDF reader tests run.
      - name: Install pinned CPU dependencies
        run: |
          grep -viE '^cupy' requirements.txt > ci-requirements.txt
          grep -E '^(grimp|networkx)==' requirements-dev.txt >> ci-requirements.txt
          python -m pip install -r ci-requirements.txt pytest "netCDF4==1.7.4"
          python -m pip install --no-deps -e .

      # The CPU substrate library is an optional extension (the package must
      # install without a compiler); CI has g++ and must actually build it, so
      # its absence fails here instead of skipping into the Python reference.
      - name: Check the native CPU substrate library
        run: python -c "from tropoi.temporal.substrate_native import host_library as h; l = h(); print(l.origin, l.flags, l.digest)"

      - name: Run the CPU test suite
        run: python -m pytest -q
