<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PAGE_TITLE__</title>
<style>
:root { --bg: #0d1117; --panel: #161b22; --ink: #e6edf3; --muted: #9da7b3; --line: #30363d; --accent: #e0a100; --bad: #f2b8b5; --badBg: #5c1d1d; --cauBg: #4d3a00; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
#app { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: 100vh; }
#stage { position: relative; min-height: 320px; }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#sky:active { cursor: grabbing; }
.banner { position: absolute; left: 10px; right: 10px; padding: 5px 9px; border-radius: 6px; font-weight: 600; pointer-events: none; }
#stageLabel { top: 10px; background: rgba(0,0,0,0.55); color: #fff; }
#stageWarn { top: 44px; }
#stageWarn.caution { background: rgba(77,58,0,0.85); color: #ffe7a3; }
#stageWarn.unreliable { background: rgba(92,29,29,0.9); color: #ffd6d3; }
#panel { overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 10px 12px 24px; }
h1 { font-size: 15px; margin: 2px 0 6px; }
details { border-top: 1px solid var(--line); padding: 6px 0; }
summary { cursor: pointer; font-weight: 600; padding: 2px 0; }
.grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; margin: 6px 0; }
.grid label { color: var(--muted); }
input[type=number], select { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; font: inherit; }
input[type=range] { width: 100%; }
input:disabled, select:disabled { opacity: 0.5; }
button { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; font: inherit; cursor: pointer; }
.row { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; }
.val { color: var(--muted); font-variant-numeric: tabular-nums; }
.note { color: var(--muted); margin: 4px 0; }
.warn { color: var(--ink); font-weight: 600; }
.err { color: var(--bad); font-weight: 600; }
.mode { display: inline-block; padding: 1px 6px; border-radius: 4px; font-weight: 700; background: #1f6feb; color: #fff; }
.mode.auto { background: #6e7681; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td, th { padding: 1px 4px; text-align: right; }
th:first-child, td:first-child { text-align: left; }
#notes li { margin: 3px 0; color: var(--muted); }
@media (max-width: 800px) { #app { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; } #panel { border-left: 0; } }
</style>
</head>
<body>
<main id="app">
  <section id="stage" aria-label="Sky seen by the observer">
    <canvas id="sky" tabindex="0" aria-label="Sky from the observer: drag or use the arrow keys to look around"></canvas>
    <div class="banner" id="stageLabel"></div>
    <div class="banner" id="stageWarn" hidden></div>
  </section>
  <aside id="panel">
    <h1 id="title"></h1>
    <p class="note warn" id="kindLabel"></p>

    <details open id="atmSection"><summary>Atmosphere</summary>
      <div id="atmHyp" class="grid">
        <label for="atmPs">Surface pressure (hPa)</label><input type="number" id="atmPs" step="any" min="0">
        <label for="atmT">Surface temperature (K)</label><input type="number" id="atmT" step="any" min="0">
        <label for="atmLapse">Lapse rate (K/km)</label><input type="number" id="atmLapse" step="any" min="0">
        <label for="atmFloor">Floor temperature (K)</label><input type="number" id="atmFloor" step="any" min="0">
        <label for="atmG">Gravity (m s⁻²)</label><input type="number" id="atmG" step="any" min="0">
        <label for="atmRMode">Gas constant</label>
        <select id="atmRMode"><option value="from_composition">from the composition (R*/M)</option><option value="fixed">fixed value</option></select>
        <label for="atmR">R (J kg⁻¹ K⁻¹)</label><input type="number" id="atmR" step="any" min="0">
        <label for="atmRadius">Planet radius (km)</label><input type="number" id="atmRadius" step="any" min="0">
      </div>
      <p class="note" id="atmNote"></p>
    </details>

    <details open><summary>Composition (mole fractions)</summary>
      <div class="grid" id="compGrid"></div>
      <div class="row"><span>Sum</span><span class="val" id="compSum"></span></div>
      <div class="row"><span><button id="compFill">Set</button> <select id="compFillWhich" aria-label="Species to set to the remainder" style="width:auto"></select> to the remainder</span></div>
      <p class="note" id="compNote"></p>
    </details>

    <details open><summary>Star</summary>
      <div class="grid">
        <label for="starT">Temperature (K)</label><input type="number" id="starT" step="any" min="0">
        <label for="starAlpha">Angular radius (°)</label><input type="number" id="starAlpha" step="any" min="0" max="30">
      </div>
      <div class="row"><button id="starSun">Sun at 1 au</button><span class="val" id="starIrr"></span></div>
      <div class="row"><span>Azimuth</span><span id="starAzL" class="val"></span></div>
      <input type="range" id="starAz" min="0" max="360" step="1" aria-label="Star azimuth (degrees clockwise from north)">
      <div class="row"><span>Elevation</span><span id="starElL" class="val"></span></div>
      <input type="range" id="starEl" min="-20" max="90" step="0.5" aria-label="Star elevation (degrees)">
      <p class="note" id="starNote"></p>
    </details>

    <details open><summary>Observer and view</summary>
      <div class="grid">
        <label for="altMode">Height given as</label>
        <select id="altMode"><option value="ground">2 m above the ground</option><option value="altitude">altitude above R (m)</option><option value="pressure">pressure (hPa)</option></select>
        <label for="altVal">Value</label><input type="number" id="altVal" step="any">
      </div>
      <p class="note" id="obsNote"></p>
      <div class="row"><span>Field of view</span><span id="fovL" class="val"></span></div>
      <input type="range" id="fov" min="20" max="140" step="1" aria-label="Horizontal field of view (degrees)">
    </details>

    <details open><summary>Exposure</summary>
      <div class="grid">
        <label for="expMode">Mode</label>
        <select id="expMode"><option value="auto">automatic (brightest sky)</option><option value="fixed">fixed reference luminance</option></select>
        <label for="expRef">White at 0 EV (cd m⁻²)</label><input type="number" id="expRef" step="any" min="0">
      </div>
      <div class="row"><span>Exposure</span><span id="evL" class="val"></span></div>
      <input type="range" id="ev" min="-10" max="10" step="0.25" aria-label="Exposure (stops)">
      <p class="note" id="expNote"></p>
      <p class="note" id="clipNote"></p>
    </details>

    <details open><summary>Optical depth and validity</summary>
      <table id="tauTable" aria-label="Rayleigh optical depth"></table>
      <p class="note" id="tauNote"></p>
    </details>

    <details><summary>Notes, limits and sources</summary>
      <ul id="notes"></ul>
    </details>
  </aside>
</main>
<script id="sky-data" type="application/json">__SKY_DATA__</script>
<script>
"use strict";
(function () {
/* Single-scattering Rayleigh sky in float64 JavaScript. It repeats
   tropoi.representation.visual.sky (radiance_table, star_path_column,
   optical_depth_diagnostic) and tropoi.spatial.optics (Composition,
   AtmosphericColumn.hypothetical, observer_altitude, Star) step for step, so
   the page and the NumPy reference agree to rounding. A visual prototype,
   not a validated sky colour: the page says so. */
const S = JSON.parse(document.getElementById("sky-data").textContent);
const HYP = S.column_kind === "hypothetical";
const O = S.optics, N = S.numerics, K = O.wavelengths_nm.length, DEG = Math.PI / 180;
const KB = O.planck.k_b;
const $ = id => document.getElementById(id);

const st = {
  atm: HYP ? Object.assign({}, S.hypothetical) : null,
  comp: [], compLabel: S.composition.label, compSource: S.composition.source,
  star: { T: S.star.temperature_k, alpha: S.star.angular_radius_deg, az: S.star.azimuth_deg, el: S.star.elevation_deg,
          label: S.star.label, source: S.star.source },
  obs: { mode: S.observer.mode, altitude_m: S.observer.altitude_m, pressure_pa: S.observer.pressure_pa },
  look: { az: S.look.azimuth_deg, el: S.look.elevation_deg, fov: S.look.fov_deg },
  exp: { mode: S.exposure.mode, ev: S.exposure.ev, ref: S.exposure.reference_cd_m2 },
  mix: null, col: null, place: null, table: null, view: null, diag: null,
  error: null, clip: null, disk: null, ms: 0, timer: 0,
};
// composition rows: the stated species in their order, then the other supported ones at 0
for (const [k, x] of S.composition.mole_fractions) st.comp.push([k, x]);
for (const k of Object.keys(S.species)) if (!st.comp.some(r => r[0] === k)) st.comp.push([k, 0]);

function radius() { return HYP ? st.atm.radius_m : S.radius_m; }
function fail(msg) { const e = new Error(msg); e.sky = true; throw e; }
function fmt(x, p) { return Number(x.toPrecision(p || 4)).toLocaleString("en-US", { maximumSignificantDigits: p || 4 }); }
function interp1(x, xp, fp) {
  // numpy.interp for ascending xp (clamped at the ends)
  const n = xp.length;
  if (x <= xp[0]) return fp[0];
  if (x >= xp[n - 1]) return fp[n - 1];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (xp[m] <= x) lo = m; else hi = m; }
  return (fp[hi] - fp[lo]) / (xp[hi] - xp[lo]) * (x - xp[lo]) + fp[lo];
}
function positive(name, v) { if (!(isFinite(v) && v > 0)) fail(name + " must be finite and > 0"); return v; }

/* Composition: mole fractions as stated, never renormalized; sigma = sum x_i sigma_i */
function mixture() {
  const rows = st.comp.filter(r => r[1] !== 0);
  for (const [k, x] of st.comp) if (!(isFinite(x) && x >= 0)) fail("mole fraction of " + k + " must be ≥ 0");
  if (!rows.length) fail("the composition needs at least one species");
  let total = 0; for (const r of rows) total += r[1];
  if (Math.abs(total - 1) > S.composition_rules.sum_tolerance)
    fail("mole fractions sum to " + total.toPrecision(9) + ", not 1 (tolerance " + S.composition_rules.sum_tolerance + "); they are never renormalized");
  const sigma = new Float64Array(K);
  let first = true, M = 0;
  for (const [k, x] of rows) {
    const s = S.species[k].cross_section_m2;
    for (let i = 0; i < K; i++) sigma[i] = first ? x * s[i] : sigma[i] + x * s[i];
    first = false;
    M += x * S.species[k].molar_mass_g_per_mol;
  }
  M /= 1000;
  return { rows: rows.map(r => [r[0], r[1]]), sigma, M, R: S.composition_rules.r_molar / M };
}

/* AtmosphericColumn.hypothetical (labelled), or the saved column (fixed) */
function column(mix) {
  if (!HYP) { const c = S.column; return { z: c.z_m, lnp: c.ln_p, T: c.temperature_k, ceiling: c.ceiling_m, R: S.r_dry, g: c.gravity }; }
  const a = st.atm;
  const ps = positive("surface pressure", a.surface_pressure_pa), t0 = positive("temperature", a.temperature_k);
  const g = positive("gravity", a.gravity), r = positive("gas constant", a.gas_constant === "from_composition" ? mix.R : a.gas_constant);
  positive("planet radius", a.radius_m);
  const gamma = a.lapse_rate_k_per_m;
  if (!(isFinite(gamma) && gamma >= 0)) fail("lapse rate must be ≥ 0");
  const lp0 = Math.log(ps), lpEnd = Math.log(ps * a.top_ratio);
  let zs, lps, ts;
  if (gamma === 0) {
    const zEnd = (lp0 - lpEnd) * r * t0 / g;
    zs = [0, zEnd]; lps = [lp0, lpEnd]; ts = [t0, t0];
  } else {
    if (a.temperature_floor_k === null) fail("a lapse rate needs a floor temperature (isothermal above it)");
    const tf = positive("floor temperature", a.temperature_floor_k);
    if (!(tf < t0)) fail("the floor temperature must be below the surface temperature");
    const zf = (t0 - tf) / gamma, expo = g / (r * gamma), n = a.nodes, step = zf / (n - 1);
    zs = []; ts = []; lps = [];
    for (let i = 0; i < n; i++) zs.push(i === n - 1 ? zf : i * step);
    for (const z of zs) ts.push(t0 - gamma * z);
    for (const t of ts) lps.push(lp0 + expo * Math.log(t / t0));
    if (lps[lps.length - 1] <= lpEnd) fail("the lapse-rate layer reaches the column top; raise the floor temperature");
    zs.push(zf + (lps[lps.length - 1] - lpEnd) * r * tf / g); lps.push(lpEnd); ts.push(tf);
  }
  return { z: zs, lnp: lps, T: ts, ceiling: zs[zs.length - 1], R: r, g };
}

/* AtmosphericColumn.observer_altitude */
function place(col) {
  const base = col.z[0], floor = Math.max(base, S.terrain_m), ps = Math.exp(col.lnp[0]);
  let z;
  if (st.obs.mode === "pressure") {
    const p = st.obs.pressure_pa;
    if (!(isFinite(p) && p > 0)) fail("pressure must be > 0");
    if (p > ps) fail(fmt(p / 100) + " hPa exceeds the surface pressure " + fmt(ps / 100) + " hPa: the observer would be underground");
    const lp = Math.log(p);
    if (lp < col.lnp[col.lnp.length - 1]) fail("pressure outside the column");
    z = interp1(lp, col.lnp.slice().reverse(), col.z.slice().reverse());
  } else if (st.obs.mode === "ground") z = floor + S.observer.ground_offset_m;
  else z = st.obs.altitude_m;
  if (!isFinite(z)) fail("altitude must be finite");
  if (z < floor - 1e-6) fail("altitude " + fmt(z) + " m is below the ground (" + fmt(floor) + " m): the observer would be underground");
  if (z > col.ceiling + 1e-6) fail("altitude " + fmt(z) + " m is above " + (HYP ? "the top of the column" : "the top saved full level") + " (" + fmt(col.ceiling) + " m)");
  return { z, p: Math.exp(interp1(z, col.z, col.lnp)), floor };
}

function densityGrid(col, G) {
  const base = col.z[0], top = col.z[col.z.length - 1], dz = (top - base) / (G - 1), lnn = new Float64Array(G);
  for (let j = 0; j < G; j++) { const z = base + dz * j; lnn[j] = interp1(z, col.z, col.lnp) - Math.log(KB * interp1(z, col.z, col.T)); }
  return { base, dz, lnn, G };
}
function dens(dg, z) {
  const x = (z - dg.base) / dg.dz;
  if (!(x >= 0 && x <= dg.G - 1)) return 0;
  const i = Math.min(Math.max(Math.floor(x), 0), dg.G - 2), f = x - i;
  return Math.exp(dg.lnn[i] + f * (dg.lnn[i + 1] - dg.lnn[i]));
}
/* sky._segments: n graded midpoint steps on [0, L], densest at the ray's lowest point */
function segs(r0, mu, L, n, mid, wid) {
  const sl = Math.min(Math.max(-r0 * mu, 0), L);
  const na = sl <= 0 ? 0 : (sl >= L ? n : Math.min(Math.max(Math.floor(n * (L > 0 ? sl / L : 0) + 0.5), 1), n - 1)), nb = n - na;
  let prev = 0;
  for (let j = 1; j <= n; j++) {
    let e;
    if (j <= na) { const t = j / na; e = sl * (1 - (1 - t) * (1 - t)); }
    else { const t = (j - na) / nb; e = sl + (L - sl) * t * t; }
    mid[j - 1] = 0.5 * (e + prev); wid[j - 1] = e - prev; prev = e;
  }
}
/* sky.radiance_table without the irradiance: per direction and bin,
   (sum of n ds exp(-tau)) * sigma * phase; the star's spectrum multiplies it later */
function geometryTable(col, zObs, starEl, sig) {
  const R = radius(), dg = densityGrid(col, N.density_nodes), top = dg.base + dg.dz * (dg.G - 1);
  const rb = R + dg.base, rt = R + top, ro = R + zObs;
  const NZ = N.n_zenith, NA = N.n_azimuth, nv = N.view_steps, ns = N.sun_steps;
  const base = new Float64Array(NZ * NA * K), ground = new Uint8Array(NZ * NA);
  const vm = new Float64Array(nv), vw = new Float64Array(nv), sm = new Float64Array(ns), sw = new Float64Array(ns), acc = new Float64Array(K);
  const e = starEl * DEG, ce = Math.cos(e), se = Math.sin(e);
  let zenithColumn = 0;
  for (let iz = 0; iz < NZ; iz++) {
    const th = (180 * iz / (NZ - 1)) * DEG, mu = Math.cos(th), sth = Math.sin(th);
    for (let ia = 0; ia < NA; ia++) {
      const ph = (180 * ia / (NA - 1)) * DEG, cph = Math.cos(ph);
      const cosBig = sth * cph * ce + mu * se;
      const discG = rb * rb - ro * ro * (1 - mu * mu), gr = mu < 0 && discG >= 0;
      let L = gr ? -ro * mu - Math.sqrt(Math.max(discG, 0)) : -ro * mu + Math.sqrt(Math.max(rt * rt - ro * ro * (1 - mu * mu), 0));
      L = Math.max(L, 0);
      segs(ro, mu, L, nv, vm, vw);
      acc.fill(0);
      let cum = 0;
      for (let i = 0; i < nv; i++) {
        const s = vm[i], rp = Math.sqrt(Math.max(ro * ro + s * s + 2 * ro * s * mu, 0));
        const n = dens(dg, rp - R), step = n * vw[i], nmid = cum + 0.5 * step;
        cum += step;
        const mus = (s * (sth * cph * ce + mu * se) + ro * se) / rp;
        if (mus < 0 && rb * rb - rp * rp * (1 - mus * mus) >= 0) continue;     // star below the solid sphere
        const ls = Math.max(-rp * mus + Math.sqrt(Math.max(rt * rt - rp * rp * (1 - mus * mus), 0)), 0);
        segs(rp, mus, ls, ns, sm, sw);
        let nsun = 0;
        for (let j = 0; j < ns; j++) { const q = sm[j]; nsun += dens(dg, Math.sqrt(Math.max(rp * rp + q * q + 2 * rp * q * mus, 0)) - R) * sw[j]; }
        const tot = nmid + nsun;
        if (step > 0) for (let k = 0; k < K; k++) acc[k] += step * Math.exp(-sig[k] * tot);
      }
      if (iz === 0 && ia === 0) zenithColumn = cum;
      const phase = 3 / (16 * Math.PI) * (1 + cosBig * cosBig), d = iz * NA + ia;
      for (let k = 0; k < K; k++) base[d * K + k] = acc[k] * sig[k] * phase;
      ground[d] = gr ? 1 : 0;
    }
  }
  // sky.star_path_column: the column along the star's own direction (its disk's attenuation)
  let starColumn = null;
  if (!(se < 0 && rb * rb - ro * ro * (1 - se * se) >= 0)) {
    const L = Math.max(-ro * se + Math.sqrt(Math.max(rt * rt - ro * ro * (1 - se * se), 0)), 0);
    segs(ro, se, L, nv, vm, vw);
    starColumn = 0;
    for (let i = 0; i < nv; i++) { const s = vm[i]; starColumn += dens(dg, Math.sqrt(Math.max(ro * ro + s * s + 2 * ro * s * se, 0)) - R) * vw[i]; }
  }
  return { base, ground, NZ, NA, zenithColumn, starColumn, sig };
}

/* Star: Planck radiance B_lambda(T) of a uniform disk of angular radius alpha */
function planck(T) {
  const h = O.planck.h, c = O.planck.c, out = new Float64Array(K);
  for (let k = 0; k < K; k++) { const lam = O.wavelengths_nm[k] * 1e-9, x = h * c / (lam * KB * T); out[k] = 2 * h * c ** 2 / lam ** 5 / Math.expm1(x) * 1e-9; }
  return out;
}
function starSolidAngle(alpha) { return 2 * Math.PI * (1 - Math.cos(alpha * DEG)); }
function checkStar() {
  if (!(isFinite(st.star.T) && st.star.T > 0)) fail("star temperature must be > 0 K");
  if (!(isFinite(st.star.alpha) && st.star.alpha > 0 && st.star.alpha < 30)) fail("star angular radius must be in (0°, 30°)");
}
/* spectral radiance, XYZ and the star disk for the current star (cheap: no ray marching) */
function illuminate(G) {
  checkStar();
  const B = planck(st.star.T), omega = starSolidAngle(st.star.alpha), W = O.cmf_weights, eff = O.luminous_efficacy;
  const n = G.NZ * G.NA, spec = new Float64Array(n * K), xyz = new Float64Array(n * 3);
  const irr = B.map(b => b * omega);
  for (let d = 0; d < n; d++) {
    let X = 0, Y = 0, Z = 0;
    for (let k = 0; k < K; k++) { const v = G.base[d * K + k] * irr[k]; spec[d * K + k] = v; X += v * W[k][0]; Y += v * W[k][1]; Z += v * W[k][2]; }
    xyz[3 * d] = eff * X; xyz[3 * d + 1] = eff * Y; xyz[3 * d + 2] = eff * Z;
  }
  let starXYZ = null;
  if (G.starColumn !== null) {
    let X = 0, Y = 0, Z = 0;
    for (let k = 0; k < K; k++) { const v = B[k] * Math.exp(-G.sig[k] * G.starColumn); X += v * W[k][0]; Y += v * W[k][1]; Z += v * W[k][2]; }
    starXYZ = [eff * X, eff * Y, eff * Z];
  }
  let lw = 0;
  for (let iz = 0; 2 * iz <= G.NZ - 1; iz++) for (let ia = 0; ia < G.NA; ia++) lw = Math.max(lw, xyz[3 * (iz * G.NA + ia) + 1]);
  let irrTotal = 0; for (let k = 0; k < K; k++) irrTotal += irr[k] * (O.bin_edges_nm[k + 1] - O.bin_edges_nm[k]);
  return { spec, xyz, starXYZ, lwhite: lw > 0 ? lw : 1, lbright: lw, irr, irrTotal };
}

/* sky.optical_depth_diagnostic */
function diagnostic(G) {
  const tz = Array.from(G.sig, s => s * G.zenithColumn), ts = G.starColumn === null ? null : Array.from(G.sig, s => s * G.starColumn);
  const peak = Math.max(...tz), D = S.diagnostic;
  return { tau_zenith: tz, tau_star: ts, peak_zenith: peak, level: peak >= D.tau_unreliable ? "unreliable" : peak >= D.tau_caution ? "caution" : "ok" };
}

/* full recompute (composition, column, observer, star elevation), then the star */
function recompute() {
  st.timer = 0;
  const t0 = performance.now();
  try {
    st.error = null;
    st.mix = mixture();
    st.col = column(st.mix);
    st.place = place(st.col);
    st.table = geometryTable(st.col, st.place.z, st.star.el, st.mix.sigma);
    st.diag = diagnostic(st.table);
    st.view = illuminate(st.table);
    st.ms = performance.now() - t0;
  } catch (err) {
    if (!err.sky) throw err;

  info: () => ({ kind: S.column_kind, error: st.error, place: st.place, observer: Object.assign({}, st.obs), look: Object.assign({}, st.look),
                 star: Object.assign({}, st.star), exposure: Object.assign({}, st.exp), white: whiteLuminance(),
                 brightest: st.view ? st.view.lbright : null, starXYZ: st.view ? st.view.starXYZ : null,
                 zenithColumn: st.table ? st.table.zenithColumn : null, starColumn: st.table ? st.table.starColumn : null,
                 diagnostic: st.diag, clip: st.clip, ms: st.ms, radius: radius(), label: S.label }),
};
})();
</script>
