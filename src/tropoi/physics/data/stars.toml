# Real stars treated as blackbodies, coolest first, each with the source of
# its numbers. A star is given either by (temperature_k, radius_rsun) or by
# (radius_rsun, luminosity_lsun); in the second case the loader derives the
# effective temperature from L = 4 pi R^2 sigma T^4, so one paper is the
# source of both numbers.
#
# "wiki:" marks values read from a Wikipedia infobox on 2026-11-07, citing
# the named reference.

schema = "palintropos.stars/1"

[stars.proxima_centauri]
name = "Proxima Centauri"
kind = "M5.5 V red dwarf"
temperature_k = 2833.0
radius_rsun = 0.162
source = "Wikipedia infobox, fetched 2026-11-07, citing Anugu, Gallenne, Kervella & Rains (2026), arXiv:2610.33373 (preprint): T_eff 2833 ± 49 K, R 0.162 ± 0.004 R_sun"

[stars.epsilon_eridani]
name = "ε Eridani"
kind = "K2 V dwarf"
radius_rsun = 0.742
luminosity_lsun = 0.326
source = "Wikipedia infobox, fetched 2026-11-07, citing Soubiran et al. (2024), A&A 682, A145: R 0.742 ± 0.004 R_sun, L 0.326 ± 0.007 L_sun; T_eff from L = 4πR²σT⁴"

[stars.sun]
name = "the Sun"
kind = "G2 V dwarf"
temperature_k = 5772.0
radius_rsun = 1.0
gm_m3_s2 = 1.3271244e20
source = "IAU 2015 B3 nominal T_eff = 5772 K, R = 695 700 km, solar mass parameter GM = 1.3271244e20 m^3 s^-2 (mass follows from CODATA G)"

[stars.procyon_a]
name = "Procyon A"
kind = "F5 IV–V subgiant"
radius_rsun = 2.043
luminosity_lsun = 7.049
source = "Wikipedia infobox, fetched 2026-11-07, citing Soubiran et al. (2024), A&A 682, A145: R 2.043 ± 0.009 R_sun, L 7.049 ± 0.064 L_sun; T_eff from L = 4πR²σT⁴"

[stars.sirius_a]
name = "Sirius A"
kind = "A0–A1 V star"
radius_rsun = 1.7144
luminosity_lsun = 24.74
source = "Wikipedia infobox, fetched 2026-11-07, citing its reference 'bond-11': R 1.7144 ± 0.0090 R_sun, L 24.74 ± 0.70 L_sun; T_eff from L = 4πR²σT⁴"
